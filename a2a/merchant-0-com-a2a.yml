surface_relationship:
  note: >-
    Merchant-0 has one real machine surface — the REST contract at api.merchant-0.com — and three discovery
    documents that describe it: the A2A card (four skills = four catalog SKUs), the UCP manifest (eight
    dev.ucp.* capabilities whose endpoints name an unresolvable host), and a REST-shaped MCP manifest for a
    separate MRO product catalog (see mcp/merchant-0-com-mcp.yml). A2A message/send is a discovery stub;
    there is no MCP-protocol endpoint; every purchase is an AP2-labelled REST call sequence.
