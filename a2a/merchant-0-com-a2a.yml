agent_card:
  name: Merchant-0
  display_name: Merchant-0 Sovereign AI Merchant
  description: >-
    Sovereign A2A merchant specialized in SEA and BRICS+ corridors. Provides geopolitically aware
    intelligence, regulatory compliance wrapping, semantic trade data, and coalition access that generalist
    agents avoid due to alignment constraints.
  url: https://api.merchant-0.com
  version: 1.0.0
  protocol_version: null
  protocol_versions_declared: ['0.3', '1.0']
  preferred_transport: null
  provider:
    organization: Merchant-0
    url: https://merchant-0.com
  did: did:web:merchant-0.com
  default_input_modes: [text]
  default_output_modes: [text]
  security_schemes: null
  security: null
  authentication_block: {methods: [DID Web, AP2 buyer_signature], did: did:web:merchant-0.com}
  documentation_url: null
  icon_url: null
  skill_count: 4
  skills:
  - {id: sea-intelligence, name: SEA Intelligence Query, tags: [intelligence, grok, SEA, BRICS, gray-zone, arbitrage, war-game, novelty-scan], sku: merchant0-intel-001, price_stated: 'USD 0.99 per query in the card; USD 2.99 per query in GET /api/catalog on 2026-09-19'}
  - {id: sea-report, name: SEA Market Intelligence Report, tags: [report, intelligence, SEA, BRICS, market-analysis, risk-assessment, opportunities, grok], sku: merchant0-report-001, price_stated: USD 4.90 per report}
  - {id: did-verification, name: Agent DID Verification, tags: [verification, DID, DID Web, A2A, conformance, registry, trust], sku: merchant0-verify-001, price_stated: USD 0.25 per check}
  - {id: subscription-proof, name: Subscription Status Proof, tags: [proof, attestation, subscription, quota, access-tier, coalition], sku: merchant0-proof-001, price_stated: USD 0.05 per proof}
  skill_invocation: >-
    None of the four skills is invoked through A2A messages. Each capability description says "Submit 'query'
    (or 'target_did' / 'subscription_id') field in AP2 execute payload": the buyer negotiates the SKU at
    POST /api/ap2/negotiate, signs at POST /api/ap2/sign, executes at POST /api/ap2/execute with the
    skill-specific field, and reads the deliverable from GET /api/intel/{execution_id}. The skill ids are
    labels for catalog SKUs (see mcp/merchant-0-com-tool-crosswalk.yml).
  non_standard_blocks: [protocol, protocolVersions, schema, did, display_name, mission, agent_api, protocols, settlement, specialization, trust_signals, endpoints, authentication, subscription_plans, contact, created, updated, status]
conformance:
  spec: A2A 1.0.0
  grade: flavored
  protocol_version: null
  preferred_transport: null
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: false
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: false
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks. protocolVersion is ABSENT — the card carries "version":
    "1.0.0" (the agent's own version) and a non-standard "protocolVersions": ["0.3","1.0"] array, and a
    reader looking for the field the spec defines finds nothing — so the card fails a hard check and is
    graded flavored. capabilities IS an object, so that check passes mechanically, but it is a map of four
    SKU ids to priced offerings ({"merchant0-intel-001": {name, type, pricing, description}}), not the A2A
    AgentCapabilities shape (streaming / pushNotifications / stateTransitionHistory / extensions); a client
    reading capabilities.streaming gets undefined. skills is an array of four well-formed skills (id, name,
    description, tags, examples). defaultInputModes/defaultOutputModes are present but hold "text" rather
    than MIME types. No preferredTransport, no supportedInterfaces/additionalInterfaces, no securitySchemes,
    no signatures.
  deviations:
  - field: protocolVersion
    observed: 'absent; "protocolVersions": ["0.3","1.0"] and "version": "1.0.0" instead'
    note: Hard failure. The plural array is not a field A2A 0.3 or 1.0 defines.
  - field: capabilities
    observed: an object keyed by SKU id (merchant0-intel-001, -report-001, -verify-001, -proof-001) with name/type/pricing/description/quota_transparency
    note: Passes the is-object check but is not the AgentCapabilities schema; the standard booleans are all absent.
  - field: url
    observed: https://api.merchant-0.com — answers 405 to POST
    note: >-
      The only JSON-RPC responder is POST https://api.merchant-0.com/message/send, advertised under the
      non-standard endpoints.message_send key. An A2A client that POSTs to the card's url fails; one that
      reaches /message/send gets a fixed acknowledgement for every method.
  - field: preferredTransport / supportedInterfaces
    observed: absent
  - field: securitySchemes / security
    observed: absent; a non-standard authentication block lists "DID Web" and "AP2 buyer_signature"
    note: Neither is an A2A security scheme; the REST contract declares no securitySchemes either (see authentication/).
  - field: defaultInputModes / defaultOutputModes
    observed: ["text"]
    note: Not MIME types (text/plain or application/json).
  - field: skills[].inputModes / outputModes / security
    observed: absent on every skill
  - field: pricing consistency
    observed: capabilities.merchant0-intel-001.pricing.amount_usd "0.99" vs GET /api/catalog price_usd "2.99" for the same SKU (2026-09-19)
    note: The card (updated 2026-05-20) and the live catalog disagree on the headline price; the catalog is the surface negotiate prices from.
  - field: endpoints.ucp_manifest / endpoints.did_document
    observed: both served (200) at the stated apex paths
    note: Recorded as a positive; the UCP manifest's own capability endpoints point at merchant0.com (no hyphen), which does not resolve — see well-known/.
