payment_semantics:
  flow: negotiate (terms, personalised by the Diplomat layer) -> sign (buyer_signature) -> execute (delivery + invoice + Wise settlement routing)
  high_value_gate: 'Agent card trust_signals.strategist_gate: deals >= USD 100.00 "receive Grok war-game analysis before sign/execute. Recommendation in AP2 negotiate response." Review state readable at GET /api/ap2/review/{contract_id}.'
  settlement: 'USD via Wise; "settlement_confirmed field in execute response" (card). Inbound Wise webhooks are consumed at POST /api/webhooks/wise (provider is the webhook CONSUMER, not a publisher).'
  x_payment_header: Declared optional on GET /api/ucp/inventory/check only; behaviour undocumented.
webhooks:
  outbound: none — the provider publishes no webhook or event surface to buyers
  inbound: POST /api/webhooks/wise (Wise -> Merchant-0, RSA-SHA256 verified, always-200)
  subscription_delivery: 'Pull model — GET /api/subscriptions/delivery?subscriber_did=&sku= ("Pull endpoint for subscriber agents")'
