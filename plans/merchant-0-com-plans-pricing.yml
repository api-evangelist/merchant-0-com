summary: >-
  Twelve purchasable per-execution products from USD 0.05 (subscription proof) to USD 65.00 (export
  scenario forecast), one purchasable monthly plan (USD 49.00 for 200 credits; 1 credit per intel query,
  3 per market report) and its annual pay-once form (USD 470.40 for 12 months, "20% new-agent discount on
  first year"). The agent card (updated 2026-05-20) still prices the headline intel query at USD 0.99 where
  the live catalog says 2.99, and the legacy card lists three SKUs (compliance-001 4.90, data-001 1.49,
  agent-001 149.00) that no longer appear. Negotiate applies "personalized pricing" through the Diplomat
  layer, so the catalog price is the list price, not necessarily the negotiated one. A free 24-hour trial of
  merchant0-intel-001 (one per DID) is granted at POST /api/ap2/trial-grant.
