openapi: 3.2.0
info:
  title: Merchant-0 A2A Protocol Server Diplomat API
  description: Agent-to-Agent Commerce API for the 2026 Agentic Economy
  version: '2026.1'
tags:
- name: Diplomat
paths:
  /api/diplomat/status:
    get:
      summary: Get Diplomat Status
      description: 'TREASURER pattern. Public. Rule #11 -- no buyer_did fields.'
      operationId: get_diplomat_status_api_diplomat_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Diplomat Status Api Diplomat Status Get
      tags:
      - Diplomat
  /api/diplomat/reputation/reset:
    post:
      summary: Diplomat Reputation Reset
      description: 'CEO-only. Rule #11 -- response surfaces only the DID hash.'
      operationId: diplomat_reputation_reset_api_diplomat_reputation_reset_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReputationResetRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Diplomat Reputation Reset Api Diplomat Reputation Reset Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Diplomat
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ReputationResetRequest:
      properties:
        sandbox_token:
          type: string
          title: Sandbox Token
        buyer_did:
          type: string
          title: Buyer Did
      type: object
      required:
      - sandbox_token
      - buyer_did
      title: ReputationResetRequest
      description: POST /api/diplomat/reputation/reset body.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
