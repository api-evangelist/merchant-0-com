openapi: 3.2.0
info:
  title: Merchant-0 A2A Protocol Server Harvest API
  description: Agent-to-Agent Commerce API for the 2026 Agentic Economy
  version: '2026.1'
tags:
- name: Harvest
paths:
  /harvest/history:
    get:
      summary: Get Harvest History
      description: 'Harvest tracker state for the Treasury dashboard.


        Zero-state: no trades have executed yet, so current_harvest_usd

        is Decimal("0") and harvest_history is an empty list. The

        harvest_target_usd is the CEO-configured threshold sourced from

        the harvest_config singleton (HARVEST_THRESHOLD_CONFIG v1.0, MP

        #46); it defaults to Decimal("0") when the DB is unreachable

        AND no HARVEST_THRESHOLD_USD env var is set, which preserves

        the original zero-state shape under failure. Response key names

        mirror the sandbox reference (see

        src/merchant0/sandbox/mock_fintech_app.py get_harvest_history)

        so the Treasury dashboard frontend works against either surface

        without change.


        IPA v2.0 specified endpoint.'
      operationId: get_harvest_history_harvest_history_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Harvest
