openapi: 3.2.0
info:
  title: Merchant-0 A2A Protocol Server Catalog API
  description: Agent-to-Agent Commerce API for the 2026 Agentic Economy
  version: '2026.1'
tags:
- name: Catalog
paths:
  /api/catalog:
    get:
      summary: Get Service Catalog
      description: 'Public A2A service catalog (A2A CATALOG v1.0).


        Optional ``category`` filter: ``intelligence`` | ``data`` | ``commerce``

        | ``agent``. Backed by Supabase when available; otherwise CEO static seed.'
      operationId: get_service_catalog_api_catalog_get
      parameters:
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Service Catalog Api Catalog Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Catalog
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
