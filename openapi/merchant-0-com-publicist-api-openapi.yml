paths:
  /api/publicist/manifest:
    get:
      summary: Get Publicist Manifest
      description: Public discovery manifest (Task 2.4). type=agent|did|ucp.
      operationId: get_publicist_manifest_api_publicist_manifest_get
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          default: agent
          title: Type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Publicist
  /api/publicist/catalog:
    get:
      summary: Get Publicist Catalog
      description: Public catalog broadcast (Task 3.1). 5-minute in-memory cache.
      operationId: get_publicist_catalog_api_publicist_catalog_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Publicist Catalog Api Publicist Catalog Get
      tags:
      - Publicist
  /api/publicist/status:
    get:
      summary: Get Publicist Status
      description: 'Public Publicist metrics (Task 5.1). Rule #11: no buyer_did.'
      operationId: get_publicist_status_api_publicist_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Publicist Status Api Publicist Status Get
      tags:
      - Publicist
