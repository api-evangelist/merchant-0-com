openapi: 3.2.0
info:
  title: Merchant-0 A2A Protocol Server Settlement API
  description: Agent-to-Agent Commerce API for the 2026 Agentic Economy
  version: '2026.1'
tags:
- name: Settlement
paths:
  /api/settlement/status:
    get:
      summary: Get Settlement Status
      description: Public settlement analytics (Task 3.1). Triggers expiry sweep.
      operationId: get_settlement_status_api_settlement_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Settlement Status Api Settlement Status Get
      tags:
      - Settlement
  /api/settlement/records:
    get:
      summary: Get Settlement Records
      description: 'CEO settlement records + summary (Task 3.2). Rule #11: hash only.'
      operationId: get_settlement_records_api_settlement_records_get
      parameters:
      - name: sandbox_token
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Sandbox Token
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Settlement Records Api Settlement Records Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Settlement
  /api/settlement/confirm:
    post:
      summary: Post Settlement Confirm
      description: 'CEO manual settlement confirmation (Task 3.3). Rule #13: CEO decision.'
      operationId: post_settlement_confirm_api_settlement_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementConfirmBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Post Settlement Confirm Api Settlement Confirm Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Settlement
components:
  schemas:
    SettlementConfirmBody:
      properties:
        sandbox_token:
          type: string
          title: Sandbox Token
          default: ''
        execution_id:
          type: string
          title: Execution Id
          default: ''
        wise_reference:
          anyOf:
          - type: string
          - type: 'null'
          title: Wise Reference
        confirmation_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Confirmation Note
      type: object
      title: SettlementConfirmBody
      description: POST /api/settlement/confirm request body (codebase BaseModel convention).
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
