openapi: 3.2.0
info:
  title: Merchant-0 A2A Protocol Server Sandbox API
  description: Agent-to-Agent Commerce API for the 2026 Agentic Economy
  version: '2026.1'
tags:
- name: Sandbox
paths:
  /sandbox/state:
    get:
      summary: Get Sandbox State
      description: 'Current operational system state.


        Consumed silently by the boardroom, ceo, and ceo/partners pages

        (see module-level comment above). Returns zero/false/empty state

        until live data is wired. Never raises for missing data -- always

        returns a valid JSON payload matching the boardroom SandboxState

        TypeScript interface so consumer pages render zero-state UI, not

        an error banner.


        Note: the path is intentionally kept as /sandbox/state for

        frontend contract compatibility. This is a production endpoint

        despite the name.'
      operationId: get_sandbox_state_sandbox_state_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Sandbox State Sandbox State Get
      tags:
      - Sandbox
