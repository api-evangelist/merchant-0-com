openapi: 3.2.0
info:
  title: Merchant-0 A2A Protocol Server Strategist API
  description: Agent-to-Agent Commerce API for the 2026 Agentic Economy
  version: '2026.1'
tags:
- name: Strategist
paths:
  /api/strategist/status:
    get:
      summary: Get Strategist Status
      description: 'Public Strategist metrics. Rule #11: no buyer_did fields.'
      operationId: get_strategist_status_api_strategist_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Strategist Status Api Strategist Status Get
      tags:
      - Strategist
  /api/strategist/briefing:
    get:
      summary: Get Strategist Briefing
      description: 'CEO-only: latest full briefing. Rule #11: no buyer_did.'
      operationId: get_strategist_briefing_api_strategist_briefing_get
      parameters:
      - name: sandbox_token
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Sandbox Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Strategist Briefing Api Strategist Briefing Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Strategist
  /api/strategist/briefing/generate:
    post:
      summary: Post Strategist Briefing Generate
      description: 'CEO-only: synchronous on-demand briefing. Rule #13 advisory.'
      operationId: post_strategist_briefing_generate_api_strategist_briefing_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategistGenerateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Post Strategist Briefing Generate Api Strategist Briefing Generate Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Strategist
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    StrategistGenerateRequest:
      properties:
        sandbox_token:
          type: string
          title: Sandbox Token
          default: ''
      type: object
      title: StrategistGenerateRequest
      description: POST /api/strategist/briefing/generate body.
