openapi: 3.2.0
info:
  title: Merchant-0 A2A Protocol Server Bank API
  description: Agent-to-Agent Commerce API for the 2026 Agentic Economy
  version: '2026.1'
tags:
- name: Bank
paths:
  /bank/usd-balance:
    get:
      summary: Get Usd Balance
      description: 'Wise USD settlement account balance for the Treasury dashboard.


        Zero-state: no inbound payments received, so balance is Decimal("0").

        Response key names mirror the sandbox reference (see

        src/merchant0/sandbox/mock_fintech_app.py get_usd_balance) so the

        Treasury dashboard frontend consumes the same shape regardless of

        which surface it calls.


        IPA v2.0 specified endpoint. USD_SETTLEMENT_ACCOUNT = KEY 17 (future

        VaultManager wiring). Manual harvest: CEO converts USD to PHP via

        the Wise app; Merchant-0 does not perform the conversion.'
      operationId: get_usd_balance_bank_usd_balance_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Bank
