        service declarations. diplomat from diplomat handler. ap2 block

        merges handler stats with Supabase ap2_executions aggregate

        (AP2 PAYMENT WIRING v1.0) for real total_executed and

        total_volume_usd.'
      operationId: get_dashboard_data_api_dashboard_a2a_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
