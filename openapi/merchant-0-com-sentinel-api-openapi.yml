openapi: 3.2.0
info:
  title: Merchant-0 A2A Protocol Server Sentinel API
  description: Agent-to-Agent Commerce API for the 2026 Agentic Economy
  version: '2026.1'
tags:
- name: Sentinel
paths:
  /api/sentinel/whitelist/add:
    post:
      summary: Sentinel Whitelist Add
      description: 'CEO-only: add a buyer DID to the Sentinel whitelist.'
      operationId: sentinel_whitelist_add_api_sentinel_whitelist_add_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhitelistMutateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Sentinel Whitelist Add Api Sentinel Whitelist Add Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Sentinel
  /api/sentinel/whitelist/remove:
    post:
      summary: Sentinel Whitelist Remove
      description: 'CEO-only: remove a buyer DID from the Sentinel whitelist.'
      operationId: sentinel_whitelist_remove_api_sentinel_whitelist_remove_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhitelistMutateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Sentinel Whitelist Remove Api Sentinel Whitelist Remove Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Sentinel
  /api/sentinel/status:
    get:
      summary: Get Sentinel Status
      description: 'Public Sentinel metrics. Rule #11: no buyer_did fields.'
      operationId: get_sentinel_status_api_sentinel_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Sentinel Status Api Sentinel Status Get
      tags:
      - Sentinel
components:
  schemas:
    WhitelistMutateRequest:
      properties:
        sandbox_token:
          type: string
          title: Sandbox Token
        buyer_did:
          type: string
          title: Buyer Did
      type: object
      required:
      - sandbox_token
      - buyer_did
      title: WhitelistMutateRequest
      description: POST /api/sentinel/whitelist/{add,remove} body.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
