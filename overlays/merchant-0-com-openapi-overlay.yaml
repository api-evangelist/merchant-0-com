- target: $.paths['/api/ap2/negotiate'].post
  description: Undeclared responses the provider documents in prose (see errors/merchant-0-com-problem-types.yml).
  update:
    x-apievangelist-undeclared-responses:
      '402': Proof-of-work challenge for FLAGGED buyers; retry with X-PoW-Solution header
      '403': sentinel_blocked — semantic firewall matched an injection pattern
      '404': Unknown item_id (SKU)
      '429': Subscription quota exhausted (agent card trust_signals.subscription_enforcement)
- target: $.paths['/api/ap2/sign'].post
  update:
