apis:
- aid: merchant-0-com:merchant-0-a2a-protocol-server-api
  name: Merchant-0 A2A Protocol Server API
  description: The REST contract behind Merchant-0's agent-commerce surface, served by a FastAPI application at
    https://api.merchant-0.com and described by a 95-operation OpenAPI 3.1.0 document at /openapi.json. Public routes
    cover service discovery (GET /api/catalog, /api/publicist/catalog), the AP2-labelled three-step purchase flow
    (POST /api/ap2/negotiate -> /api/ap2/sign -> /api/ap2/execute, with the result read back from GET /api/intel/{execution_id}),
    a free 24-hour trial grant, buyer-filed disputes, per-subscription quota (GET /api/subscriptions/{id}/usage),
    a UCP capability manifest and an MRO product catalog search, plus a REST-shaped MCP manifest (GET /api/mcp/manifest,
    /api/mcp/tools). The same document also publishes the operator's internal control plane (kill switch, credit
    limits, price bands, settlement confirmation, agent-council status) gated by a body/query sandbox_token the
    contract does not describe. The document declares no servers[], no securitySchemes, no tags and only 200/422
    responses; the base URL below was confirmed from the host the spec is served on and the agent card's agent_api
    field.
  humanURL: https://merchant-0.com/
  baseURL: https://api.merchant-0.com
  tags:
