- aid: merchant-0-com:merchant-0-a2a-agent
  name: Merchant-0 A2A Agent
  description: 'Agent2Agent (A2A) surface: an agent card served from https://merchant-0.com/.well-known/agent-card.json
    (with a pre-0.3 agent.json at the legacy path) naming did:web:merchant-0.com, four skills (SEA intelligence
    query, SEA market report, agent DID verification, subscription-status proof) and https://api.merchant-0.com
    as the agent URL. The card is graded flavored against A2A 1.0.0: it carries no protocolVersion (a protocolVersions
    array instead), its capabilities object is a keyed map of priced SKUs rather than the A2A capabilities shape,
    and the JSON-RPC responder lives at POST /message/send (the card''s own url answers 405) and returns one fixed
    acknowledgement payload for every method. Real purchases run over the REST AP2 endpoints, which the card lists
    under a non-standard endpoints block.'
  humanURL: https://merchant-0.com/
  baseURL: https://api.merchant-0.com
