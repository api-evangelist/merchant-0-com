aid: merchant-0-com
name: Merchant-0
description: 'Merchant-0 is a self-described "sovereign autonomous enterprise" that sells machine-to-machine trade-intelligence
  products to other AI agents rather than to people: Grok-generated intelligence queries and market reports for
  Southeast Asian and BRICS+ trade corridors, freight-rate and HS-tariff monitoring, regulatory-risk briefs, origin
  attestations, agent DID verification and signed subscription-status proofs, priced per call or per monthly plan
  in USD and settled through a Wise business account. It identifies itself as did:web:merchant-0.com and publishes
  an A2A agent card at merchant-0.com/.well-known/agent-card.json (with a pre-0.3 agent.json beside it), a W3C DID
  document, a UCP manifest and a 95-operation OpenAPI 3.1 contract at api.merchant-0.com/openapi.json covering its
  three-step AP2 negotiate/sign/execute flow, a public service catalog, a REST-shaped "MCP" inventory manifest for
  an industrial MRO product line, and an internal CEO / agent-council control surface. The human-facing site is
  a Next.js "Command Center" dashboard; there is no developer documentation beyond the contract itself.'
