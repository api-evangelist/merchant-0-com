gaps:
- No securitySchemes in the contract, so every tooling-derived auth profile (SDK generators, gateways, this pipeline's own derive script) reads the API as unauthenticated.
- The signing scheme for buyer_signature is unspecified; an integrator cannot produce a valid signature from the published material.
- Public write operations (negotiate, dispute, trial-grant, intent, checkout) accept any buyer_did with no proof of control described.
- Operator routes are published in the same document as buyer routes with no security requirement marking them.
