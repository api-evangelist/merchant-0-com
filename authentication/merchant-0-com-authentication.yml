summary: >-
  The OpenAPI declares NO securitySchemes and NO security requirements on any of its 95 operations, and
  derive-authentication.py therefore produced no profile. Read against the contract's own descriptions and
  the agent card, the real model is: buyer-facing routes are open — a caller asserts its identity by placing
  its own did:web DID in the request body (buyer_did) and, at the sign step, an opaque buyer_signature whose
  message and key the contract never defines; access is then shaped by reputation (a FLAGGED DID gets a 402
  proof-of-work challenge answered with the X-PoW-Solution header) and by a semantic firewall (403
  sentinel_blocked), not by credentials. Trial execution is authenticated by a trial_nonce issued with the
  grant. Operator routes take an undocumented sandbox_token as a query or body field — "Body-field token (NOT
  Bearer) per the established convention" — and answer 401 {"detail":"Unauthorized"} without it. There are no
  API keys, no OAuth, no OIDC, no mTLS and no bearer tokens anywhere. The provider's own identity is a did:web
  DID with a published Ed25519 key.
