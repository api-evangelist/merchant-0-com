summary: >-
  Merchant-0 advertises "MCP - Live - Model Context Protocol - LLM inventory access (GEO optimized) -
  /api/mcp/inventory" on its homepage, and its OpenAPI declares five /api/mcp/* routes, but NO MCP-protocol
  server exists: there is no endpoint that answers JSON-RPC initialize or tools/list, no stdio package, and
  no server card. What the provider publishes is a REST-shaped tool manifest — GET /api/mcp/manifest (also
  /api/mcp/capabilities) returns {mcp_version "2026.1", server_id "mcp://merchant0.com/inventory", name
  "Merchant-0 Inventory Server", tools[3] with input_schema, resources[2]} and GET /api/mcp/tools returns the
  same three tools — for an industrial MRO product catalog (fasteners, sensors, safety, electrical,
  pneumatics) that is a different product line from the A2A intelligence catalog. Because the tool list and
  input schemas are the provider's own, they are saved verbatim in mcp/merchant-0-com-mcp-manifest.json; because
  no MCP client can connect to anything, deployment.mode is none and no endpoint is recorded. An agent that
  wants these tools calls the REST operations they wrap (see mcp/merchant-0-com-tool-crosswalk.yml).
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: probed
  note: >-
    Every path the provider names or that the protocol conventionally uses was POSTed a JSON-RPC 2.0
    tools/list (Accept: application/json, text/event-stream) and an initialize on 2026-09-19:
    https://api.merchant-0.com/api/mcp/inventory -> 404 {"detail":"Not Found"};
    https://api.merchant-0.com/mcp -> 404; https://api.merchant-0.com/api/mcp -> 404;
    https://merchant-0.com/api/mcp/inventory, /mcp, /api/mcp -> 404 (Next.js HTML 404). The homepage's
    "/api/mcp/inventory" path does not exist on either host; the OpenAPI's nearest route is POST
    /api/mcp/inventory/search, a plain REST call. No endpoint URL is recorded because none was verified,
    and a guessed one would read as an agent surface that does not exist.
